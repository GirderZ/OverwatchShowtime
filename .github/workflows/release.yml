name: Build Windows release
on:
  push:
    branches: [main]
    paths: [package.json, '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        shell: powershell
      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and package version differ' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm run release:win
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify silent install and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'OverwatchShowtime-install-check'
          $setup = @(Get-ChildItem release/*Setup-x64.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer' }
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList "/S /currentuser /D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'OverwatchTime.exe'))) { throw 'Installed executable missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'resources/app.asar.unpacked/app/windows/monitor.ps1'))) { throw 'Installed monitor missing' }
          $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -Filter 'Uninstall*.exe')
          if ($uninstallers.Count -ne 1) { throw 'Uninstaller missing' }
          $process = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent uninstall failed: $($process.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'OverwatchTime.exe')) { throw 'Uninstall did not remove executable' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*Setup-x64.exe
            release/*Windows-x64.zip
            release/install.ps1
            release/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; existing assets will not be overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/* --target "$RELEASE_COMMIT" --title "屁股时间 $RELEASE_TAG" --generate-notes
